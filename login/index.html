<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; style-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'self'; object-src 'none'">
  <title>Owner sign in · iselin.dev</title>
  <link rel="stylesheet" href="/public/styles.css">
  <script src="/supabase/config.js"></script>
  <script type="module" src="/assets/auth.js"></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">iselin.dev</a><nav class="nav" aria-label="Main navigation"><a href="/blog/">Blog</a><a class="sign-in" href="/login/">Owner sign in</a></nav></header>
  <main>
    <section class="panel narrow">
      <p class="eyebrow">Private area</p><h1 class="page-title">Owner sign in</h1>
      <p class="quiet">Only the site owner can access private notes and files.</p>
      <p id="message" class="message" role="status" aria-live="polite" hidden></p>
      <form id="login-form" class="form-stack">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <footer class="site-footer"><p>iselin.dev · A personal site. Add your own introduction and writing when you're ready.</p></footer>
</body>
</html>
